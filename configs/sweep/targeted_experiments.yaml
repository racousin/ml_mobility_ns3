# @package _global_
# Targeted experiments with most promising configurations

defaults:
  - override /model: vae_lstm
  - override /training: patient_training
  - override /data: default

# Hydra configuration for parallel execution
hydra:
  mode: MULTIRUN
  sweep:
    dir: experiments/targeted_sweep_${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher

# Base configuration
accelerator: gpu

# Parameter combinations (20 experiments total)
hydra:
  sweeper:
    _target_: hydra._internal.config_repository.ConfigRepository
  job:
    chdir: false

# Define specific experiment configurations
multirun:
  - override /model: vae_lstm
    override /training: patient_training
    model.hidden_dim: 256
    model.latent_dim: 32
    training.learning_rate: 0.001
    training.loss.params.beta.params.end: 0.005
    training.loss.params.free_bits.lambda_free_bits: 3.0
    devices: [3]
    
  - override /model: vae_lstm
    override /training: patient_training
    model.hidden_dim: 256
    model.latent_dim: 32
    training.learning_rate: 0.0005
    training.loss.params.beta.params.end: 0.01
    training.loss.params.free_bits.lambda_free_bits: 2.0
    devices: [4]
    
  - override /model: vae_lstm
    override /training: warmup_training
    model.hidden_dim: 512
    model.latent_dim: 32
    training.learning_rate: 0.001
    training.loss.params.beta.params.end: 0.001
    training.loss.params.free_bits.lambda_free_bits: 4.0
    devices: [5]
    
  - override /model: vae_lstm
    override /training: warmup_training
    model.hidden_dim: 256
    model.latent_dim: 16
    training.learning_rate: 0.0005
    training.loss.params.beta.params.end: 0.005
    training.loss.params.free_bits.lambda_free_bits: 3.0
    devices: [6]
    
  - override /model: vae_attention
    override /training: patient_training
    model.hidden_dim: 128
    model.latent_dim: 32
    model.n_heads: 4
    training.learning_rate: 0.001
    training.loss.params.beta.params.end: 0.005
    training.loss.params.free_bits.lambda_free_bits: 3.0
    devices: [3]
    
  - override /model: vae_attention
    override /training: patient_training
    model.hidden_dim: 128
    model.latent_dim: 16
    model.n_heads: 8
    training.learning_rate: 0.0005
    training.loss.params.beta.params.end: 0.01
    training.loss.params.free_bits.lambda_free_bits: 2.0
    devices: [4]
    
  - override /model: vae_attention
    override /training: warmup_training
    model.hidden_dim: 256
    model.latent_dim: 32
    model.n_heads: 8
    training.learning_rate: 0.001
    training.loss.params.beta.params.end: 0.001
    training.loss.params.free_bits.lambda_free_bits: 4.0
    devices: [5]
    
  - override /model: vae_lstm
    override /training: patient_training
    model.hidden_dim: 128
    model.latent_dim: 16
    training.learning_rate: 0.002
    training.loss.params.beta.params.end: 0.002
    training.loss.params.free_bits.lambda_free_bits: 3.5
    devices: [6]
    
  - override /model: vae_lstm
    override /training: patient_training
    model.hidden_dim: 512
    model.latent_dim: 64
    training.learning_rate: 0.0005
    training.loss.params.beta.params.end: 0.001
    training.loss.params.free_bits.lambda_free_bits: 4.0
    training.batch_size: 64
    devices: [3]
    
  - override /model: vae_lstm
    override /training: warmup_training
    model.hidden_dim: 256
    model.latent_dim: 32
    model.num_layers: 3
    training.learning_rate: 0.001
    training.loss.params.beta.params.end: 0.003
    training.loss.params.free_bits.lambda_free_bits: 3.0
    devices: [4]