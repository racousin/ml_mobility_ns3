# @package _global_
# Example configuration for VAE-LSTM starting from pretrained weights
# Usage: python scripts/train.py +experiment=vae_lstm_from_pretrained  devices=[6] accelerator=gpu

defaults:
  - data: netmob25
  - model: vae_lstm
  - training: default
  - _self_

# Model configuration (should match the pretrained model architecture)
model:
  hidden_dim: 128
  latent_dim: 16
  num_layers: 2
  condition_dim: 32
  dropout: 0.1

# Training configuration
training:
  # Path to pretrained checkpoint
  pretrained_checkpoint: experiments/vae_lstm_2025-07-16_12-30-52/checkpoints/best_model.ckpt
  
  # Training hyperparameters (can be different from original)
  epochs: 2000  # Shorter fine-tuning
  batch_size: 128
  learning_rate: 0.0001  # Lower learning rate for fine-tuning
  
  # Early stopping and LR scheduling
  early_stopping_enabled: true
  early_stopping_patience: 20
  lr_scheduler_enabled: true
  lr_scheduler_patience: 10
  lr_scheduler_factor: 0.5
  
  # Loss configuration (can be adjusted for fine-tuning)
  loss:
    type: simple_vae
    params:
      beta:
        type: adaptive_slow_annealing
        params:
          target_beta: 1.0                # Final beta value to reach
          beta_increment: 0.001           # Small increments (1000 increases from 0 to 1)
          patience_epochs: 50            # Wait 100 epochs without improvement
          improvement_threshold: 1e-4     # Minimum improvement threshold
      free_bits:
        enabled: true
        lambda_free_bits: 2.0

  # Monitoring metrics
  best_metric_monitor: val_loss
  early_stopping_monitor: val_loss
  lr_scheduler_monitor: val_loss

# Device configuration
accelerator: gpu
devices: [0]  # Adjust based on your system

seed: 42