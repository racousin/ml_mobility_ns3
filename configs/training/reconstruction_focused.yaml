# Long reconstruction-focused training configuration
# Uses adaptive beta annealing that increases only when loss converges

batch_size: 128
epochs: 50000  # Very long training run
learning_rate: 0.001
val_split: 0.1
gradient_clip: 1.0

# Disable early stopping for long training
early_stopping_enabled: false
early_stopping_patience: 50  # Not used when disabled
early_stopping_monitor: val_loss

# Disable learning rate scheduling (or make it very patient)
lr_scheduler_enabled: false
lr_scheduler_patience: 1000  # Very patient if enabled
lr_scheduler_factor: 0.5
lr_scheduler_monitor: val_loss
lr_min: 1e-7

# Best model monitoring
best_metric_monitor: val_loss

# Loss configuration with adaptive beta annealing
loss:
  type: simple_vae
  params:
    beta:
      type: adaptive_slow_annealing
      params:
        target_beta: 1.0                # Final beta value
        beta_increment: 0.001           # Very small increments (0.001 means 1000 increases to reach 1.0)
        patience_epochs: 100            # Wait 100 epochs without improvement before increasing beta
        improvement_threshold: 1e-4     # Minimum improvement to reset patience counter
    free_bits:
      enabled: true
      lambda_free_bits: 2.0  # Helps prevent posterior collapse