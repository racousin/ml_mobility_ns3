batch_size: 32
epochs: 2000
learning_rate: 0.001
val_split: 0.1
gradient_clip: 1.0
# Warmup strategy with very patient early stopping
early_stopping_patience: 200
early_stopping_monitor: val_recon_loss
early_stopping_mode: min
early_stopping_min_delta: 0.00001
lr_scheduler_patience: 60
lr_scheduler_factor: 0.5
lr_scheduler_monitor: val_recon_loss
best_metric_monitor: val_loss
# Warmup then gradual increase
loss:
  type: simple_vae
  params:
    beta:
      type: exponential_annealing
      params:
        start: 0.0  # Pure reconstruction at start
        end: 0.005  # Lower final beta
        anneal_epochs: 800
        rate: 0.995
    free_bits:
      enabled: true
      lambda_free_bits: 4.0  # Very lenient free bits